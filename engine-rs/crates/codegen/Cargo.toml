[package]
name = "codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Phase 1b: build-time codegen that reads the existing card catalog JSON
# (under shared/) and emits a const Rust table. Avoids the dual source of
# truth called out in §7 "Open questions" of the scoping doc.

[[bin]]
name = "codegen"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
