[package]
name = "sim-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Four binaries matching `backend/package.json`'s `sim:*` scripts. Each
# accepts flags identical to its TS counterpart and writes the same stdout
# JSON shape. See `docs/ai-research/scoping/rust-engine-port-plan.md` § 2.

[[bin]]
name = "sim-throughput-probe"
path = "src/bin/throughput_probe.rs"

[[bin]]
name = "sim-eval-gate"
path = "src/bin/eval_gate.rs"

[[bin]]
name = "sim-mcts-selfplay"
path = "src/bin/mcts_selfplay.rs"

[[bin]]
name = "sim-rebel-selfplay"
path = "src/bin/rebel_selfplay.rs"

[[bin]]
name = "sim-export-training"
path = "src/bin/export_training.rs"

# R16-P3 spike Option A parity-smoke binary. Drives both the new
# in-process ORT path AND the legacy serve_onnx HTTP path on N random
# game states and asserts numeric agreement to <=1e-5 abs. External
# stopping gate for the inference slice.
[[bin]]
name = "sim-inference-parity"
path = "src/bin/inference_parity.rs"

[[bin]]
name = "sim-relabel-leaf-values"
path = "src/bin/relabel_leaf_values.rs"

[dependencies]
engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
arrayvec.workspace = true
# Only the parity smoke needs HTTP — kept lean (default features off,
# tls-only) so the production sim-cli binaries (which no longer talk
# HTTP after R16-P3 Option A) don't pull in TLS at link time.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
