[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/sim-cli",
    "crates/golden-replay",
    "crates/codegen",
    "crates/xtask",
    "crates/napi-bridge",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["umamusume-card-duel"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
indexmap = { version = "2", features = ["serde"] }
arrayvec = { version = "0.7", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"
